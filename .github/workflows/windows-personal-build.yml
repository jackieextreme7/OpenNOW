name: Windows build (personal fork)

# Builds an unsigned Windows x64 installer of an official OpenNOW release with
# only the in-stream "Session" controller hint removed. Start it from the
# Actions tab with "Run workflow"; leave the version empty to build the newest
# official nightly. Download the result from the run's "Artifacts" section.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Official OpenNOW tag to build, for example v1.0.3-nightly.990.1 (empty = newest nightly)
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-personal-build.yml

permissions:
  contents: read

concurrency:
  group: windows-personal-build
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Choose the official version
        id: tag
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          tag="$REQUESTED"
          if [[ -z "$tag" ]]; then
            tag=$(git ls-remote --tags --refs https://github.com/OpenCloudGaming/OpenNOW 'v*-nightly.*' \
              | sed 's#.*refs/tags/##' | sort -V | tail -n 1)
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(nightly|supporter)\.[1-9][0-9]*\.[1-9][0-9]*)?$ ]]; then
            echo "Unexpected OpenNOW tag: '$tag'"
            exit 1
          fi
          echo "Building OpenNOW $tag without the Session hint"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  windows-x64:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      SDL_VERSION: release-3.2.20
      OPENNOW_BUILD_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout official OpenNOW ${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: OpenCloudGaming/OpenNOW
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Remove the in-stream Session hint
        shell: python
        run: |
          import pathlib
          import sys

          path = pathlib.Path("opennow-qt/qml/screens/StreamScreen.qml")
          text = path.read_text(encoding="utf-8")
          hint = '            SessionGlyphs.Hint { objectName: "streamSessionHint"; prompts: glyphs; button: "GUIDE"; label: qsTr("Session") }\n'
          panel = '        visible: root.videoReady && AppController.overlay === ""\n'
          if text.count(hint) != 1 or text.count(panel) != 1:
              sys.exit("StreamScreen.qml changed upstream; the Session hint patch needs updating.")
          text = text.replace(hint, "")
          # Hide the pill entirely when no hint is left to show (controller input).
          text = text.replace(panel, panel[:-1] + " && streamHints.implicitWidth > 0\n")
          path.write_text(text, encoding="utf-8")
          print("Removed the in-stream Session hint.")

      - name: Enable Windows Media Foundation
        shell: pwsh
        run: .github/scripts/ensure-windows-media-foundation.ps1

      - name: Map stable Windows workspace
        shell: pwsh
        run: .github/scripts/map-windows-workspace.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Windows build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bound Windows Rust compilation
        shell: pwsh
        run: |
          "CARGO_BUILD_JOBS=4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $linker)) { throw "The MSVC x64 linker is unavailable." }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Windows LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "clang.exe")) -or
              -not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "LLVM installation is missing libclang.dll"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools
          cache: true
          cache-key-prefix: qt-target-windows-x64

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: personal-windows-x64
          cache-bin: false
          cache-on-failure: true
          workspaces: |
            native/opennow-core -> ../../build/opennow-qt-release/rust-target
            native/opennow-core -> ../../build/opennow-qt-release/update-helper-rust-target
            native/opennow-streamer -> ../../build/opennow-qt-release/streamer-rust-target

      - name: Cache Qt C++ compilation
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639
        with:
          key: personal-windows-x64
          restore-keys: personal-windows-x64
          max-size: 1G

      - name: Build and cache SDL3
        uses: ./.github/actions/sdl3
        with:
          version: ${{ env.SDL_VERSION }}
          target-arch: x64
          parallel: 4

      - name: Configure Qt release
        shell: bash
        run: |
          cd /o
          cmake -S opennow-qt -B build/opennow-qt-release \
            -G "Ninja Multi-Config" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENNOW_BUILD_VERSION="$OPENNOW_BUILD_VERSION" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL-install"

      - name: Build Qt release
        shell: bash
        run: |
          cd /o
          cmake --build build/opennow-qt-release --config Release --parallel 4

      - name: Create portable ZIP
        shell: bash
        run: |
          cd /o
          mkdir -p build/qt-packages
          cpack --config build/opennow-qt-release/CPackConfig.cmake \
            -C Release -G ZIP -B build/qt-packages

      - name: Build setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = @(Get-ChildItem build/qt-packages -Filter *.zip)
          if ($zip.Count -ne 1) { throw "Expected one portable ZIP" }
          $payload = Join-Path $env:RUNNER_TEMP "setup-payload"
          if (Test-Path $payload) { Remove-Item $payload -Recurse -Force }
          Expand-Archive $zip[0].FullName $payload
          $setup = Join-Path (Resolve-Path build/qt-packages) ([IO.Path]::GetFileNameWithoutExtension($zip[0].Name) + "-setup.exe")
          ./opennow-qt/packaging/windows/build-setup.ps1 -Payload $payload -Version $env:OPENNOW_BUILD_VERSION -Arch x64 -OutputFile $setup

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-${{ needs.resolve.outputs.version }}-Windows-x64-no-session-hint
          path: |
            build/qt-packages/*.zip
            build/qt-packages/*-setup.exe
          if-no-files-found: error
